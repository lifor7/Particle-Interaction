<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子辉光 · 星系环状粒子系统</title>
<style>
/* ===================================================================
   GLOBAL STYLES
   =================================================================== */
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0816; /* 更深邃的深空底色（黑蓝紫） */
  overflow:hidden;
  font-family:'Segoe UI','Inter',system-ui,sans-serif;
  height:100vh;width:100vw;
}
canvas{display:block}

/* ---- bottom hint ---- */
.info-hint{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,0.25);font-size:11.5px;letter-spacing:0.6px;
  pointer-events:none;user-select:none;transition:opacity 1.5s;
}

/* ===================================================================
   CONTROL PANEL — Tech frosted glass
   =================================================================== */
.control-panel{
  position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:10;
  background:rgba(6,4,16,0.58);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:15px;
  padding:20px 16px 16px;width:210px;
  color:rgba(255,255,255,0.75);font-size:12px;line-height:1.55;
  box-shadow:0 8px 44px rgba(0,0,0,0.50),inset 0 1px 0 rgba(255,255,255,0.03),0 0 0 1px rgba(120,80,200,0.06);
  animation:panelIn 0.7s ease-out;
}
@keyframes panelIn{
  from{opacity:0;transform:translateY(-50%) translateX(-14px)}
  to{opacity:1;transform:translateY(-50%) translateX(0)}
}

.panel-title{
  font-size:10px;text-transform:uppercase;letter-spacing:2px;
  color:rgba(255,255,255,0.32);margin-bottom:12px;text-align:center;
}
.panel-title span{color:rgba(180,150,240,0.55)}

/* section label with english sub */
.section-label{
  font-size:10px;letter-spacing:0.8px;
  color:rgba(255,255,255,0.32);margin:11px 0 6px;
  display:flex;justify-content:space-between;align-items:baseline;
}
.section-label .en{font-size:8.5px;color:rgba(255,255,255,0.22);letter-spacing:0.4px}
.section-label .val{
  color:rgba(200,180,240,0.65);font-size:10px;
  font-variant-numeric:tabular-nums;
}

/* ---- form (形态) buttons ---- */
.form-buttons{display:flex;gap:6px}
.form-btn{
  flex:1;padding:7px 4px;border:1px solid rgba(255,255,255,0.16);border-radius:7px;
  background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.65);
  font-size:12px;cursor:pointer;transition:all 0.25s;font-family:inherit;letter-spacing:0.5px;text-align:center;
}
.form-btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.32);color:#fff}
.form-btn.active{
  background:linear-gradient(135deg,rgba(120,90,220,0.26),rgba(80,140,220,0.18));
  border-color:rgba(165,140,240,0.55);color:#fff;
  box-shadow:0 0 12px rgba(140,120,230,0.25);
}

/* ---- color scheme buttons ---- */
.scheme-buttons{display:flex;flex-wrap:wrap;gap:5px}
.scheme-btn{
  flex:1 1 calc(50% - 5px);min-width:74px;
  padding:6px 3px;border:1px solid rgba(255,255,255,0.13);border-radius:6px;
  background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.60);
  font-size:11px;cursor:pointer;transition:all 0.25s;
  font-family:inherit;letter-spacing:0.3px;text-align:center;
}
.scheme-btn:hover{
  background:rgba(255,255,255,0.10);border-color:rgba(255,255,255,0.28);
  color:rgba(255,255,255,0.90);
}
.scheme-btn.active{
  background:rgba(200,170,255,0.12);border-color:rgba(185,160,240,0.50);
  color:#fff;box-shadow:0 0 10px rgba(160,130,230,0.20);
}

/* ---- color dot picker ---- */
.color-dots{
  display:flex;gap:7px;justify-content:flex-start;
  margin-top:2px;
}
.color-dot{
  width:17px;height:17px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.15);
  cursor:pointer;transition:all 0.22s;
  box-shadow:0 0 0 transparent;
}
.color-dot:hover{border-color:rgba(255,255,255,0.45);transform:scale(1.15)}
.color-dot.active{
  border-color:rgba(255,255,255,0.65);
  box-shadow:0 0 12px currentColor;
}

/* ---- generic slider ---- */
.ctrl-slider{
  -webkit-appearance:none;appearance:none;width:100%;height:3.5px;
  border-radius:2px;background:rgba(255,255,255,0.13);outline:none;
  margin:4px 0 2px;
}
.ctrl-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:14px;height:14px;
  border-radius:50%;background:rgba(200,185,245,0.80);
  border:2px solid rgba(255,255,255,0.40);cursor:pointer;
  box-shadow:0 0 8px rgba(155,125,220,0.32);transition:box-shadow 0.2s;
}
.ctrl-slider::-webkit-slider-thumb:hover{
  box-shadow:0 0 16px rgba(170,140,235,0.50);
}
</style>
</head>
<body>

<div class="info-hint" id="hint">✦ Drag to rotate &nbsp;|&nbsp; Scroll to zoom &nbsp;|&nbsp; Q 切换形态 ✦</div>

<!-- ===================================================================
     CONTROL PANEL
     =================================================================== -->
<div class="control-panel" id="controlPanel">
  <div class="panel-title"><span>◆</span>&nbsp; Particle Control</div>

  <!-- Form 形态 -->
  <div class="section-label">Form <span class="en">形态</span></div>
  <div class="form-buttons" id="formButtons">
    <button class="form-btn active" data-form="nebula">星云</button>
    <button class="form-btn" data-form="cloud">云</button>

  <div class="section-label">Palette <span class="en">配色方案</span></div>

  <div class="color-dots" id="colorDots">
    <span class="color-dot active" data-tint="none" style="background:conic-gradient(#f0f, #0ff, #0f0, #ff0, #f0f);color:#fff"></span>
    <span class="color-dot" data-tint="magenta" style="background:#e040a0;color:#e040a0"></span>
    <span class="color-dot" data-tint="cyan" style="background:#30c8d8;color:#30c8d8"></span>
    <span class="color-dot" data-tint="gold" style="background:#e8b830;color:#e8b830"></span>
    <span class="color-dot" data-tint="purple" style="background:#9060d8;color:#9060d8"></span>

  </div>

  <!-- Particle Size -->
  <div class="section-label">Size <span class="en">粒子大小</span> <span class="val" id="sizeVal">100%</span></div>

  <input type="range" class="ctrl-slider" id="flowSlider" min="0" max="3.0" value="1.0" step="0.01">

  <!-- Ring Thickness -->
  <div class="section-label">Ring Thick <span class="en">环形厚度</span> <span class="val" id="thickVal">1.00</span></div>
  <input type="range" class="ctrl-slider" id="thickSlider" min="0.4" max="2.5" value="1.0" step="0.01">

  <!-- Bloom Strength -->
  <div class="section-label">Bloom <span class="en">辉光强度</span> <span class="val" id="bloomVal">1.10</span></div>
  <input type="range" class="ctrl-slider" id="bloomSlider" min="0.4" max="2.2" value="1.10" step="0.01">
</div>

<!-- Three.js import map -->
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"

</script>

<!-- ===================================================================
     MAIN SCRIPT
     =================================================================== -->
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

/*
 * =====================================================================
 * TUNABLE PARAMETERS — 三维球形螺旋星云
 * =====================================================================
 */
const PARTICLE_COUNT       = 16000;   // 粒子总数
const SPHERE_RADIUS        = 2.8;     // 内核球体半径
const RING1_RADIUS         = 4.6;     // 环1 半径
const RING2_RADIUS         = 6.5;     // 环2 半径
const RING3_RADIUS         = 8.4;     // 环3 半径
const RING_WIDTH           = 2.2;     // 每个环的径向分布宽度（增大使环间有重叠过渡）
const RING1_HALF_HEIGHT    = 0.30;    // 环1 半高
const RING2_HALF_HEIGHT    = 0.40;    // 环2 半高
const RING3_HALF_HEIGHT    = 0.50;    // 环3 半高
const RADIAL_POWER_SPHERE  = 0.65;    // 球体径向幂次（<1 中心密，提高=扩散减缓中心聚集）
const MAX_RADIUS_REF       = 10.4;    // 着色归一化参考半径 (≈RING3 + RING_WIDTH)
const BROWNIAN_AMPLITUDE   = 0.018;   // 布朗运动振幅
const BROWNIAN_SPEED       = 0.03;    // 布朗运动相位变化速率
const FLOW_SPEED_BASE      = 0.12;    // 旋转基础流速 (rad/s at r=1)

// -- 形态二：无定形不规则云（弱中心聚集、边界模糊、粒子持续漂移游走） --
const CLOUD_PARTICLE_COUNT = 8000;    // 粒子总数（减半，更稀疏）
const CLOUD_DRIFT_SPEED    = 0.5;     // 漂移峰值速度 (units/s)
const CLOUD_DRIFT_TURN     = 0.7;     // 漂移方向缓慢转向速率 (rad/s)
const CLOUD_SOFT_RADIUS    = 9.0;     // 软约束半径（超出后缓慢拉回云内）
const CLOUD_SPRING_K       = 1.0;     // 软弹簧回拉系数
const CLOUD_REF            = 10.0;    // 着色归一化参考半径

// -- 辉光 --
const BLOOM_STRENGTH_DEF   = 1.10;
const BLOOM_RADIUS         = 0.30;
const BLOOM_THRESHOLD      = 0.05;

// -- 闪烁 --
const FLICKER_CHANCE   = 0.010;
const FLICKER_BOOST    = 2.5;
const FLICKER_FRAMES   = 5;

// -- 外围飘散粒子 --
const DRIFT_COUNT       = 400;     // 额外飘散粒子数
const DRIFT_RADIUS_MIN  = RING3_RADIUS + RING_WIDTH/2;
const DRIFT_RADIUS_MAX  = RING3_RADIUS + RING_WIDTH/2 + 2.0;

/*
 * =====================================================================
 * RUNTIME VARIABLES (driven by UI sliders)
 * =====================================================================
 */
let userSizeScale    = 1.0;
let userFlowScale    = 1.0;
let userRingThick    = 1.0; // kept for future use
let userBloom        = BLOOM_STRENGTH_DEF;
let currentScheme    = 'deepspace';
let currentTint      = 'none';
let currentTintHue   = null;
let currentForm      = 'nebula';   // 'nebula' 星云(一型) | 'cloud' 无定形云(二型)

// ==================== SCENE SETUP ====================

const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0816'); // 更深邃的黑蓝紫底色
scene.fog = new THREE.FogExp2(0x0a0816, 0.00007);

const camera = new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,100);
camera.position.set(0,1.8,15);
camera.lookAt(0,0,0);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 30;
controls.target.set(0,0,0);
controls.update();

// ---- bloom ----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth,window.innerHeight),
  userBloom, BLOOM_RADIUS, BLOOM_THRESHOLD
);
composer.addPass(bloomPass);

// ---- glow texture ----
function createGlowTex(){
  const s=128,c=document.createElement('canvas');
  c.width=s;c.height=s;
  const ctx=c.getContext('2d'),h=s/2;
  const g=ctx.createRadialGradient(h,h,0,h,h,h);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.03,'rgba(255,255,255,0.95)');
  g.addColorStop(0.12,'rgba(255,255,255,0.70)');
  g.addColorStop(0.28,'rgba(255,255,255,0.30)');
  g.addColorStop(0.52,'rgba(255,255,255,0.06)');
  g.addColorStop(0.78,'rgba(255,255,255,0.008)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
  const t=new THREE.CanvasTexture(c);t.needsUpdate=true;return t;
}
const glowTex = createGlowTex();

// ==================== COLOR SYSTEM — 逐粒子独立随机着色 ====================
// 每个粒子按半径概率 + 独立大抖动着色，任意局部 ≥3 种色相

const COLOR_SCHEMES = {
  // 每套含 10 个色锚: 暖金星点(0-2) / 冷色星云主体(3-6) / 冰青点缀(7-8) / 红色点缀(9)
  deepspace: { // ★ 深邃深空 (default) — 深蓝紫星云 + 银青 + 稀疏暖金星光 + 暗红点缀
    colors: [
      [0.11,0.28,0.80], [0.09,0.24,0.86], [0.13,0.32,0.74],           // 暖金星点 (3个)
      [0.64,0.55,0.40], [0.70,0.52,0.36], [0.66,0.60,0.44], [0.74,0.48,0.33], // 深蓝/靛蓝/蓝紫 (4个)
      [0.55,0.42,0.52], [0.52,0.36,0.58],                             // 冰青/银青 (2个)
      [0.99,0.52,0.42],                                               // 暗红点缀 (1个)
    ],
  },
  nebula: { // 紫罗兰星云 — 品红紫 + 蓝紫 + 粉紫暖星
    colors: [
      [0.95,0.30,0.82], [0.92,0.26,0.86], [0.98,0.34,0.78],
      [0.78,0.50,0.42], [0.82,0.48,0.38], [0.76,0.55,0.45], [0.85,0.45,0.35],
      [0.62,0.40,0.55], [0.60,0.35,0.58],
      [0.94,0.58,0.45],
    ],
  },
  ocean: { // 深海青碧 — 深青蓝 + 冰青 + 微弱暖星
    colors: [
      [0.14,0.28,0.82], [0.12,0.24,0.86], [0.16,0.30,0.78],
      [0.58,0.52,0.40], [0.60,0.48,0.36], [0.56,0.56,0.44], [0.62,0.44,0.33],
      [0.50,0.42,0.55], [0.48,0.38,0.58],
      [0.99,0.50,0.42],
    ],
  },
  sunset: { // 余晖黄昏 — 暗琥珀 + 深橙红 + 暮色青
    colors: [
      [0.08,0.45,0.78], [0.06,0.42,0.82], [0.10,0.48,0.74],
      [0.02,0.55,0.42], [0.05,0.50,0.38], [0.00,0.60,0.44], [0.03,0.48,0.35],
      [0.55,0.40,0.50], [0.52,0.36,0.54],
      [0.00,0.62,0.42],
    ],
  },
  default: { // 经典银白星空 — 蓝银 + 银青 + 暖白
    colors: [
      [0.12,0.25,0.84], [0.10,0.22,0.88], [0.14,0.28,0.80],
      [0.62,0.45,0.44], [0.66,0.42,0.40], [0.60,0.50,0.48], [0.70,0.40,0.36],
      [0.57,0.35,0.58], [0.54,0.32,0.60],
      [0.99,0.48,0.42],
    ],
  },
};

const TINT_HUES = {none:null, magenta:0.88, cyan:0.54, gold:0.12, purple:0.76, green:0.38};

// 冷色星云主体(约80%) + 稀疏暖金星点(约12%) + 少量暗红点缀(约7%)，整体压低亮度营造深邃星空
function pickParticleColor(rNorm, scheme){
  const cs = scheme.colors;
  let h, s, l;
  const roll = Math.random();

  if(roll < 0.12 - 0.04 * rNorm){
    // 稀疏暖金星点：概率随半径略降，高亮散布作恒星
    const i = Math.floor(Math.random() * 3);          // 暖星锚 0-2
    [h,s,l] = cs[i];
    l = Math.min(0.96, l + Math.random() * 0.18);     // 高亮星光
    s = Math.max(0.08, Math.min(0.70, s + (Math.random() - 0.5) * 0.15));
  }else if(roll < 0.19 - 0.04 * rNorm){
    // 少量暗红点缀：低饱和偏暗的红，如遥远红巨星，不喧宾夺主
    [h,s,l] = cs[9];                                   // 红锚 9
    l = Math.max(0.16, Math.min(0.66, l + (Math.random() - 0.5) * 0.18));
    s = Math.max(0.18, Math.min(0.78, s + (Math.random() - 0.5) * 0.16));
  }else{
    // 冷色星云主体：蓝紫/靛蓝为主，冰青点缀，压低亮度 → 深邃
    if(Math.random() < 0.72){
      const i = 3 + Math.floor(Math.random() * 4);    // 冷主体 3-6
      [h,s,l] = cs[i];
    }else{
      const i = 7 + Math.floor(Math.random() * 2);    // 冰青点缀 7-8
      [h,s,l] = cs[i];
    }
    l = Math.max(0.15, Math.min(0.72, l + (Math.random() - 0.5) * 0.26));
    s = Math.max(0.12, Math.min(0.85, s + (Math.random() - 0.5) * 0.22));
  }

  h += (Math.random() - 0.5) * 0.09;

  // tint 偏移
  if(currentTintHue !== null){
    const diff = currentTintHue - h;
    h += diff * 0.40;
  }
  h = ((h % 1) + 1) % 1;

  return new THREE.Color().setHSL(h, s, l);
}

// 统一重着色（换配色 / 快速选色时复用），自动区分星云与立方体的半径归一化参考
function recolorLayer(layer, scheme){
  if(layer.isDrift)return;
  const colAttr=layer.geometry.attributes.color;const colArr=colAttr.array;
  const ref=layer.isCloud?CLOUD_REF:MAX_RADIUS_REF;
  for(let i=0;i<layer.count;i++){
    const r=layer.radii?layer.radii[i]:0;
    const rNorm=Math.min(1,r/ref);
    const c=pickParticleColor(rNorm,scheme);
    colArr[i*3]=Math.min(1,c.r*layer.brightness);
    colArr[i*3+1]=Math.min(1,c.g*layer.brightness);
    colArr[i*3+2]=Math.min(1,c.b*layer.brightness);
  }
  colAttr.needsUpdate=true;
  if(layer.flickSaved)layer.flickSaved.set(colArr);
}

// 标准正态分布采样（Box-Muller），用于无定形云的多高斯斑块
function gauss(){
  let u=0,v=0;
  while(u===0)u=Math.random();
  while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

// ==================== BUILD PARTICLES：中心球体 + 三重环带 ====================

const layerDefs = [
  {name:'sphere',baseSize:0.32,brightness:1.00,schemeKey:'sphere',countFrac:0.25},
  {name:'ring1', baseSize:0.26,brightness:1.05,schemeKey:'ring1', countFrac:0.25},
  {name:'ring2', baseSize:0.22,brightness:0.95,schemeKey:'ring2', countFrac:0.25},
  {name:'ring3', baseSize:0.18,brightness:0.85,schemeKey:'ring3', countFrac:0.25},
];

const layers = [];
const particleGroup = new THREE.Group();
scene.add(particleGroup);

const cloudGroup = new THREE.Group();   // 二型：无定形云粒子
cloudGroup.visible = false;
scene.add(cloudGroup);

const allParts = [];
for(const def of layerDefs){
  const count = Math.round(PARTICLE_COUNT * def.countFrac);
  const li = layerDefs.indexOf(def);

  for(let i=0;i<count;i++){
    let x,y,z,r,theta;

    if(def.name==='sphere'){
      theta = Math.random()*Math.PI*2;
      const phi = Math.acos(2*Math.random()-1);
      r = SPHERE_RADIUS*Math.pow(Math.random(),RADIAL_POWER_SPHERE);
      x = r*Math.sin(phi)*Math.cos(theta);
      y = r*Math.sin(phi)*Math.sin(theta);
      z = r*Math.cos(phi);
    }else{
      theta = Math.random()*Math.PI*2;
      const ringIdx = parseInt(def.name.slice(-1));
      const ringRadius = [0, RING1_RADIUS, RING2_RADIUS, RING3_RADIUS][ringIdx];
      const halfHeight = [0, RING1_HALF_HEIGHT, RING2_HALF_HEIGHT, RING3_HALF_HEIGHT][ringIdx];
      const gauss = (Math.random()+Math.random()+Math.random())/3;
      r = ringRadius + (gauss-0.5)*RING_WIDTH*1.8;
      const yBase = (Math.random()-0.5)*2*halfHeight*Math.pow(Math.random(),1.3);
      x = r*Math.cos(theta);
      y = yBase;
      z = r*Math.sin(theta);
    }

    allParts.push({layer:li, x,y,z, r, theta});
  }
}

for(const def of layerDefs){
  const li = layerDefs.indexOf(def);
  const parts = allParts.filter(p=>p.layer===li);
  const count = parts.length;

  const posArr = new Float32Array(count*3);
  const colArr = new Float32Array(count*3);
  const scheme = COLOR_SCHEMES[currentScheme];

  for(let i=0;i<count;i++){
    const p=parts[i];
    posArr[i*3]=p.x; posArr[i*3+1]=p.y; posArr[i*3+2]=p.z;
    const rNorm = Math.min(1, p.r / MAX_RADIUS_REF);
    const c = pickParticleColor(rNorm, scheme);
    colArr[i*3]=Math.min(1,c.r*def.brightness);
    colArr[i*3+1]=Math.min(1,c.g*def.brightness);
    colArr[i*3+2]=Math.min(1,c.b*def.brightness);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(posArr,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colArr,3));

  const mat = new THREE.PointsMaterial({
    size:def.baseSize, map:glowTex, vertexColors:true,
    blending:THREE.AdditiveBlending, depthWrite:false, depthTest:true,
    transparent:true, opacity:0.88,
  });

  const pts = new THREE.Points(geo,mat);
  particleGroup.add(pts);

  const origPos = new Float32Array(posArr);
  const phases = new Float32Array(count*3);
  for(let i=0;i<count*3;i++)phases[i]=Math.random()*Math.PI*2;
  const displacement = new Float32Array(count*3);
  const initThetas = new Float32Array(count);
  for(let i=0;i<count;i++)initThetas[i]=parts[i].theta;
  const radii = new Float32Array(count);
  for(let i=0;i<count;i++)radii[i]=parts[i].r;
  const flickTimers = (def.name==='ring3')?new Uint8Array(count):null;
  const flickSaved  = (def.name==='ring3')?new Float32Array(count*3):null;

  layers.push({
    name:def.name, points:pts, geometry:geo, material:mat,
    origPositions:origPos, phases, displacement,
    initThetas, radii,
    flickTimers, flickSaved,
    baseSize:def.baseSize, brightness:def.brightness,
    schemeKey:def.schemeKey, count, form:'nebula',
  });
}

(function createDriftParticles(){
  const count = DRIFT_COUNT;
  const posArr = new Float32Array(count*3);
  const colArr = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const theta=Math.random()*Math.PI*2;
    const r=DRIFT_RADIUS_MIN+Math.random()*(DRIFT_RADIUS_MAX-DRIFT_RADIUS_MIN);
    const z=(Math.random()-0.5)*2*RING3_HALF_HEIGHT*3.5;
    posArr[i*3]=r*Math.cos(theta);posArr[i*3+1]=z;posArr[i*3+2]=r*Math.sin(theta);
    const c=new THREE.Color().setHSL(0.58+Math.random()*0.08,0.30,0.40+Math.random()*0.18);
    colArr[i*3]=c.r;colArr[i*3+1]=c.g;colArr[i*3+2]=c.b;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(posArr,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colArr,3));
  const mat=new THREE.PointsMaterial({
    size:0.12,map:glowTex,vertexColors:true,
    blending:THREE.AdditiveBlending,depthWrite:false,depthTest:true,
    transparent:true,opacity:0.55,
  });
  const driftPts=new THREE.Points(geo,mat);
  particleGroup.add(driftPts);
  layers.push({
    name:'drift',points:driftPts,geometry:geo,material:mat,
    origPositions:new Float32Array(posArr), phases:new Float32Array(count*3),
    displacement:new Float32Array(count*3),
    initThetas:null, radii:null, flickTimers:null, flickSaved:null,
    baseSize:0.12, brightness:1.0, schemeKey:'ring3', count, isDrift:true, form:'nebula',
  });
  const dp=layers[layers.length-1].phases;
  for(let i=0;i<count*3;i++)dp[i]=Math.random()*Math.PI*2;
})();

// ==================== BUILD PARTICLES：二型 无定形不规则云（多高斯斑块融合） ====================
(function createCloudParticles(){
  const count = CLOUD_PARTICLE_COUNT;
  // 多个高斯斑块叠加，形成轮廓不规则、边界模糊的无定形云
  const BLOB_COUNT = 6;
  const bcx=new Float32Array(BLOB_COUNT), bcy=new Float32Array(BLOB_COUNT), bcz=new Float32Array(BLOB_COUNT);
  const bsigma=new Float32Array(BLOB_COUNT);
  for(let b=0;b<BLOB_COUNT;b++){
    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos(2*Math.random()-1);
    const rr=2.6*Math.sqrt(Math.random());
    bcx[b]=rr*Math.sin(phi)*Math.cos(theta);
    bcy[b]=rr*Math.sin(phi)*Math.sin(theta);
    bcz[b]=rr*Math.cos(phi);
    bsigma[b]=2.0+Math.random()*1.4;
  }
  const posArr = new Float32Array(count*3);
  const colArr = new Float32Array(count*3);
  const radii  = new Float32Array(count);
  for(let i=0;i<count;i++){
    const b=Math.floor(Math.random()*BLOB_COUNT);
    const x=bcx[b]+gauss()*bsigma[b];
    const y=bcy[b]+gauss()*bsigma[b];
    const z=bcz[b]+gauss()*bsigma[b];
    posArr[i*3]=x; posArr[i*3+1]=y; posArr[i*3+2]=z;
    radii[i]=Math.sqrt(x*x+y*y+z*z);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(posArr,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colArr,3));
  const mat=new THREE.PointsMaterial({
    size:0.22,map:glowTex,vertexColors:true,
    blending:THREE.AdditiveBlending,depthWrite:false,depthTest:true,
    transparent:true,opacity:0.85,
  });
  const pts=new THREE.Points(geo,mat);
  cloudGroup.add(pts);

  const layer={
    name:'cloud',form:'cloud',isCloud:true,
    points:pts,geometry:geo,material:mat,
    origPositions:new Float32Array(posArr),
    phases:new Float32Array(count*3),
    displacement:new Float32Array(count*3),
    initThetas:null,radii,flickTimers:null,flickSaved:null,
    baseSize:0.22,brightness:1.0,schemeKey:'cloud',count,
    isDrift:false,
  };
  for(let i=0;i<count*3;i++)layer.phases[i]=Math.random()*Math.PI*2;
  layers.push(layer);
  recolorLayer(layer, COLOR_SCHEMES[currentScheme]);
})();


// ==================== ANIMATION LOOP ====================

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1);
  const dt60=dt*60;
  const elapsed=clock.getElapsedTime();

  controls.update();

  // Global rotation (slow)
  particleGroup.rotation.y += 0.0003;
  particleGroup.updateMatrixWorld();

  // ---- Per-layer particle update (布朗运动 + 闪烁, 无斥力) ----
  for(const layer of layers){
    if(layer.form!==currentForm)continue;
    const posAttr=layer.geometry.attributes.position;
    const colAttr=layer.geometry.attributes.color;
    const posArr=posAttr.array;const colArr=colAttr?colAttr.array:null;
    const orig=layer.origPositions;const phases=layer.phases;
    const disp=layer.displacement;const n=layer.count;
    const isOuter=(layer.flickTimers!==null);
    const isDrift=!!layer.isDrift;

    let colDirty=false;
    for(let i=0;i<n;i++){
      const i3=i*3;

      // -- 二型：持续漂移游走（方向缓慢转向 + 软边界拉回，无硬边） --
      if(layer.isCloud){
        phases[i3]  +=(Math.random()-0.5)*CLOUD_DRIFT_TURN*dt;
        phases[i3+1]+=(Math.random()-0.5)*CLOUD_DRIFT_TURN*dt;
        phases[i3+2]+=(Math.random()-0.5)*CLOUD_DRIFT_TURN*dt;
        let nx=posArr[i3]  +Math.sin(phases[i3])  *CLOUD_DRIFT_SPEED*dt;
        let ny=posArr[i3+1]+Math.sin(phases[i3+1])*CLOUD_DRIFT_SPEED*dt;
        let nz=posArr[i3+2]+Math.sin(phases[i3+2])*CLOUD_DRIFT_SPEED*dt;
        const r=Math.hypot(nx,ny,nz);
        if(r>CLOUD_SOFT_RADIUS){
          const f=Math.max(0, 1 - CLOUD_SPRING_K*dt*(r-CLOUD_SOFT_RADIUS)/r);
          nx*=f; ny*=f; nz*=f;
        }
        posArr[i3]=nx; posArr[i3+1]=ny; posArr[i3+2]=nz;
        continue;
      }

      // -- Brownian --
      phases[i3]+=(Math.random()-0.5)*BROWNIAN_SPEED*dt60;
      phases[i3+1]+=(Math.random()-0.5)*BROWNIAN_SPEED*dt60;
      phases[i3+2]+=(Math.random()-0.5)*BROWNIAN_SPEED*dt60;
      const bx=Math.sin(phases[i3])*BROWNIAN_AMPLITUDE;
      const by=Math.sin(phases[i3+1])*BROWNIAN_AMPLITUDE;
      const bz=Math.sin(phases[i3+2])*BROWNIAN_AMPLITUDE;

      // Compose position (Brownian only, no repulsion)
      posArr[i3]=orig[i3]+bx;
      posArr[i3+1]=orig[i3+1]+by;
      posArr[i3+2]=orig[i3+2]+bz;

      // -- Flicker for outer particles --
      if(isOuter&&colArr){
        let ft=layer.flickTimers[i];
        if(ft>0){ft--;layer.flickTimers[i]=ft;if(ft===0){colArr[i3]=layer.flickSaved[i3];colArr[i3+1]=layer.flickSaved[i3+1];colArr[i3+2]=layer.flickSaved[i3+2];colDirty=true;}}
        else if(Math.random()<FLICKER_CHANCE*dt60){
          layer.flickSaved[i3]=colArr[i3];layer.flickSaved[i3+1]=colArr[i3+1];layer.flickSaved[i3+2]=colArr[i3+2];
          const boost=Math.min(1,FLICKER_BOOST*(0.7+Math.random()*0.3));
          colArr[i3]=Math.min(1,colArr[i3]*boost);colArr[i3+1]=Math.min(1,colArr[i3+1]*boost);colArr[i3+2]=Math.min(1,colArr[i3+2]*boost);
          layer.flickTimers[i]=FLICKER_FRAMES;colDirty=true;
        }
      }
    }
    posAttr.needsUpdate=true;
    if(colDirty&&colAttr)colAttr.needsUpdate=true;
  }

  // ---- Galaxy differential rotation (per-layer Y-axis rotation modifier) ----
  // Instead of messing per-particle, rotate each layer's Points at different speeds
  if(userFlowScale>0.001){
    const baseSpeed=FLOW_SPEED_BASE*userFlowScale*dt60*0.016;
    for(const layer of layers){
      if(layer.form!=='nebula')continue;
      if(layer.isDrift){layer.points.rotation.y+=baseSpeed*0.4;continue;}
      // sphere rotates fastest, ring3 slowest (like real galaxy)
      const speedMod=layer.name==='sphere'?1.6:layer.name==='ring1'?1.2:layer.name==='ring2'?0.75:0.40;
      layer.points.rotation.y+=baseSpeed*speedMod;
    }
  }

  // ---- Bloom ----
  bloomPass.strength=userBloom+Math.sin(elapsed*0.42)*0.05;

  composer.render();
}

// ==================== UI INTERACTIONS ====================

// -- Scheme buttons --
const schemeBtns=document.querySelectorAll('.scheme-btn');
function updateActiveSchemeBtn(scheme){
  schemeBtns.forEach(b=>b.classList.toggle('active',b.dataset.scheme===scheme));
}
function switchColorScheme(schemeKey){
  if(!COLOR_SCHEMES[schemeKey]||schemeKey===currentScheme)return;
  currentScheme=schemeKey;
  const scheme=COLOR_SCHEMES[schemeKey];
  for(const layer of layers)recolorLayer(layer,scheme);
  updateActiveSchemeBtn(schemeKey);
}
schemeBtns.forEach(b=>b.addEventListener('click',()=>{const s=b.dataset.scheme;if(s)switchColorScheme(s);}));

// -- Form (形态) buttons --
const formBtns=document.querySelectorAll('.form-btn');
function updateActiveFormBtn(form){
  formBtns.forEach(b=>b.classList.toggle('active',b.dataset.form===form));
}
function switchForm(form){
  if(!['nebula','cloud'].includes(form)||form===currentForm)return;
  currentForm=form;
  particleGroup.visible=(form==='nebula');
  cloudGroup.visible=(form==='cloud');
  updateActiveFormBtn(form);
}
formBtns.forEach(b=>b.addEventListener('click',()=>switchForm(b.dataset.form)));

// -- Color dots --
const colorDots=document.querySelectorAll('.color-dot');
function updateActiveDot(tint){
  colorDots.forEach(d=>d.classList.toggle('active',d.dataset.tint===tint));
}
colorDots.forEach(d=>d.addEventListener('click',()=>{
  const tint=d.dataset.tint;
  if(!tint||tint===currentTint)return;
  currentTint=tint;currentTintHue=TINT_HUES[tint];
  updateActiveDot(tint);
  // Re-apply current scheme (which will use the new tint)
  const scheme=COLOR_SCHEMES[currentScheme];
  for(const layer of layers)recolorLayer(layer,scheme);
}));

// -- Sliders --
const sizeSlider=document.getElementById('sizeSlider');
const sizeVal=document.getElementById('sizeVal');
sizeSlider.addEventListener('input',()=>{
  userSizeScale=parseFloat(sizeSlider.value);sizeVal.textContent=Math.round(userSizeScale*100)+'%';
  for(const layer of layers){if(!layer.isDrift)layer.material.size=layer.baseSize*userSizeScale;}
});

const flowSlider=document.getElementById('flowSlider');
const flowVal=document.getElementById('flowVal');
flowSlider.addEventListener('input',()=>{
  userFlowScale=parseFloat(flowSlider.value);flowVal.textContent=userFlowScale.toFixed(2);
});

const thickSlider=document.getElementById('thickSlider');
const thickVal=document.getElementById('thickVal');
thickSlider.addEventListener('input',()=>{
  userRingThick=parseFloat(thickSlider.value);thickVal.textContent=userRingThick.toFixed(2);
});

const bloomSlider=document.getElementById('bloomSlider');
const bloomVal=document.getElementById('bloomVal');
bloomSlider.addEventListener('input',()=>{
  userBloom=parseFloat(bloomSlider.value);bloomPass.strength=userBloom;bloomVal.textContent=userBloom.toFixed(2);
});

// ==================== KEYBOARD SHORTCUTS ====================

window.addEventListener('keydown',e=>{
  switch(e.key.toLowerCase()){
    case'1':switchColorScheme('deepspace');break;
    case'2':switchColorScheme('nebula');break;
    case'3':switchColorScheme('ocean');break;
    case'4':switchColorScheme('sunset');break;
    case'5':switchColorScheme('default');break;
    case'r':sizeSlider.value=1.0;sizeSlider.dispatchEvent(new Event('input'));break;
    case'f':flowSlider.value=userFlowScale<0.1?1.0:0;flowSlider.dispatchEvent(new Event('input'));break;
    case'b':bloomSlider.value=userBloom>0.8?0.5:BLOOM_STRENGTH_DEF;bloomSlider.dispatchEvent(new Event('input'));break;
    case'q':switchForm(currentForm==='nebula'?'cloud':'nebula');break;
  }
});

// ==================== RESPONSIVE ====================

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);composer.setSize(window.innerWidth,window.innerHeight);
});

// ==================== STARTUP ====================

setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity='0';},10000);
animate();
</script>
