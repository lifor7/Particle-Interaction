<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>粒子交互 — Particle Interaction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- 操作提示（左下角半透明小字，不干扰视觉） -->
  <div class="hint">
    移动鼠标 — 吸引粒子 &nbsp;|&nbsp; 按住鼠标 — 排斥粒子 &nbsp;|&nbsp; 点击 — 生成粒子<br>
    触摸 — 生成粒子 &nbsp;|&nbsp; <kbd>Space</kbd> 切换引力 / 斥力模式
  </div>

  <script src="particle.js"></script>
</body>
</html>
