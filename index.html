<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子辉光 · 星系环状粒子系统</title>
<style>
/* ===================================================================
   GLOBAL STYLES
   =================================================================== */
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0816; /* 更深邃的深空底色（黑蓝紫） */
  overflow:hidden;
  font-family:'Segoe UI','Inter',system-ui,sans-serif;
  height:100vh;width:100vw;
}
canvas{display:block}

/* ---- bottom hint ---- */
.info-hint{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,0.25);font-size:11.5px;letter-spacing:0.6px;
  pointer-events:none;user-select:none;transition:opacity 1.5s;
}

/* ===================================================================
   CONTROL PANEL — Tech frosted glass
   =================================================================== */
.control-panel{
  position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:10;
  background:rgba(6,4,16,0.58);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:15px;
  padding:20px 16px 16px;width:210px;
  color:rgba(255,255,255,0.75);font-size:12px;line-height:1.55;
  box-shadow:0 8px 44px rgba(0,0,0,0.50),inset 0 1px 0 rgba(255,255,255,0.03),0 0 0 1px rgba(120,80,200,0.06);
  animation:panelIn 0.7s ease-out;
}
@keyframes panelIn{
  from{opacity:0;transform:translateY(-50%) translateX(-14px)}
  to{opacity:1;transform:translateY(-50%) translateX(0)}
}

.panel-title{
  font-size:10px;text-transform:uppercase;letter-spacing:2px;
  color:rgba(255,255,255,0.32);margin-bottom:12px;text-align:center;
}
.panel-title span{color:rgba(180,150,240,0.55)}

/* section label with english sub */
.section-label{
  font-size:10px;letter-spacing:0.8px;
  color:rgba(255,255,255,0.32);margin:11px 0 6px;
  display:flex;justify-content:space-between;align-items:baseline;
}
.section-label .en{font-size:8.5px;color:rgba(255,255,255,0.22);letter-spacing:0.4px}
.section-label .val{
  color:rgba(200,180,240,0.65);font-size:10px;
  font-variant-numeric:tabular-nums;
}

/* ---- form (形态) buttons ---- */
.form-buttons{display:flex;gap:6px}
.form-btn{
  flex:1;padding:7px 4px;border:1px solid rgba(255,255,255,0.16);border-radius:7px;
  background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.65);
  font-size:12px;cursor:pointer;transition:all 0.25s;font-family:inherit;letter-spacing:0.5px;text-align:center;
}
.form-btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.32);color:#fff}
.form-btn.active{
  background:linear-gradient(135deg,rgba(120,90,220,0.26),rgba(80,140,220,0.18));
  border-color:rgba(165,140,240,0.55);color:#fff;
  box-shadow:0 0 12px rgba(140,120,230,0.25);
}

/* ---- color scheme buttons ---- */
.scheme-buttons{display:flex;flex-wrap:wrap;gap:5px}
.scheme-btn{
  flex:1 1 calc(50% - 5px);min-width:74px;
  padding:6px 3px;border:1px solid rgba(255,255,255,0.13);border-radius:6px;
  background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.60);
  font-size:11px;cursor:pointer;transition:all 0.25s;
  font-family:inherit;letter-spacing:0.3px;text-align:center;
}
.scheme-btn:hover{
  background:rgba(255,255,255,0.10);border-color:rgba(255,255,255,0.28);
  color:rgba(255,255,255,0.90);
}
.scheme-btn.active{
  background:rgba(200,170,255,0.12);border-color:rgba(185,160,240,0.50);
  color:#fff;box-shadow:0 0 10px rgba(160,130,230,0.20);
}

/* ---- color dot picker ---- */
.color-dots{
  display:flex;gap:7px;justify-content:flex-start;
  margin-top:2px;
}
.color-dot{
  width:17px;height:17px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.15);
  cursor:pointer;transition:all 0.22s;
  box-shadow:0 0 0 transparent;
}
.color-dot:hover{border-color:rgba(255,255,255,0.45);transform:scale(1.15)}
.color-dot.active{
  border-color:rgba(255,255,255,0.65);
  box-shadow:0 0 12px currentColor;
}

/* ---- generic slider ---- */
.ctrl-slider{
  -webkit-appearance:none;appearance:none;width:100%;height:3.5px;
  border-radius:2px;background:rgba(255,255,255,0.13);outline:none;
  margin:4px 0 2px;
}
.ctrl-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:14px;height:14px;
  border-radius:50%;background:rgba(200,185,245,0.80);
  border:2px solid rgba(255,255,255,0.40);cursor:pointer;
  box-shadow:0 0 8px rgba(155,125,220,0.32);transition:box-shadow 0.2s;
}
.ctrl-slider::-webkit-slider-thumb:hover{
  box-shadow:0 0 16px rgba(170,140,235,0.50);
}

/* ---- gesture status badge ---- */
.gesture-status{
  position:fixed;right:18px;bottom:150px;z-index:20;
  display:flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:0.4px;color:rgba(255,255,255,0.5);
  pointer-events:none;user-select:none;
}
.gesture-badge{
  width:8px;height:8px;border-radius:50%;background:#555;flex:none;
  transition:background 0.3s,box-shadow 0.3s;
}
.gesture-badge.tracking{background:#5f8;box-shadow:0 0 8px #5f8}
.gesture-badge.lost    {background:#f84;box-shadow:0 0 6px #f84}
.gesture-badge.error   {background:#f44;box-shadow:0 0 6px #f44;animation:pulse 1.2s infinite}
.gesture-badge.off     {background:#555}
@keyframes pulse{50%{opacity:0.35}}

/* ---- webcam preview ---- */
.webcam-wrap{
  position:fixed;right:18px;bottom:18px;z-index:20;
  width:150px;border-radius:12px;overflow:hidden;
  border:1px solid rgba(255,255,255,0.10);
  background:rgba(0,0,0,0.35);
  box-shadow:0 6px 24px rgba(0,0,0,0.40);
  opacity:0;transition:opacity 0.8s;pointer-events:none;
}
.webcam-wrap.on{opacity:0.85}
.webcam-wrap video{width:100%;height:auto;display:block;transform:scaleX(-1);filter:saturate(0.75) contrast(1.05)}

/* ---- camera permission toast ---- */
.cam-toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:30;
  background:rgba(20,12,32,0.92);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:10px;padding:10px 16px;
  font-size:12px;color:rgba(255,255,255,0.85);
  display:none;max-width:72vw;text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,0.50);
}

/* ---- gesture enable toggle ---- */
.gesture-toggle{
  width:100%;padding:8px 4px;border:1px solid rgba(255,255,255,0.16);border-radius:8px;
  background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.65);
  font-size:12px;cursor:pointer;transition:all 0.25s;
  font-family:inherit;letter-spacing:0.5px;text-align:center;
}
.gesture-toggle:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.32);color:#fff}
.gesture-toggle.active{
  background:linear-gradient(135deg,rgba(120,220,160,0.22),rgba(80,140,220,0.16));
  border-color:rgba(120,220,170,0.55);color:#fff;box-shadow:0 0 12px rgba(110,220,160,0.22);
}
</style>
</head>
<body>

<div class="info-hint" id="hint">✦ Drag 旋转 | Scroll 缩放 | Q/按钮切换形态 | ✋ 序列1: 左右转·上下俯仰·前后推拉 · L锁俯仰 | M→序列2: 🖐张→放大·🤏合拢→缩小/云变十字·手掌位置→平移 ✦</div>

<div class="gesture-status">
  <span class="gesture-badge off" id="gestureBadge"></span>

<div class="control-panel" id="controlPanel">
  <div class="panel-title"><span>◆</span>&nbsp; Particle Control</div>

  <div class="section-label">Form <span class="en">形态</span></div>
  <div class="form-buttons" id="formButtons">

  <input type="range" class="ctrl-slider" id="bloomSlider" min="0.4" max="2.2" value="1.10" step="0.01">

  <!-- Gesture Toggle -->
  <div class="section-label">Gestures <span class="en">手势控制</span></div>
  <button class="gesture-toggle" id="gestToggle">开启手势</button>

  <button class="gesture-toggle" id="seqBtn" disabled>序列1</button>
</div>

<!-- MediaPipe 资源已全部本地化（mediapipe/ 目录），不依赖外网 CDN -->
<!-- 库文件用 ESM 方式在下方 import，wasm 与模型走相对路径 -->

<!-- ===================================================================
     MAIN SCRIPT
     =================================================================== -->
<script type="module">
import * as THREE from 'three';
import {FilesetResolver, HandLandmarker} from './mediapipe/vision_bundle.mjs';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

// ==================== 手势相机控制 (MediaPipe Hands) ====================
const GEST_WASM   = './mediapipe/wasm';
const GEST_MODEL  = './mediapipe/hand_landmarker.task';
const GEST_ROT_SPEED = 3.2;      // 左右满幅时的旋转速度 (rad/s)：手越靠边转得越快
const PITCH_SPEED     = 3.0;      // 上下满幅俯仰速度 (rad/s)：手在上→俯仰加大+拉近（探头式）
const PITCH_MIN       = 0.15;     // 最小俯仰角（≈8°，近水平）
const PITCH_MAX       = 1.35;     // 最大俯仰角（≈77°，极俯瞰）
const PITCH_DIST_NEAR = 0.85;     // 俯仰最大时距离缩放（拉近看细节）
const PITCH_DIST_FAR  = 1.15;     // 俯仰最小时距离缩放（推远看全局）
const GEST_ROT_SMOOTH= 0.18;     // 旋转速度缓动系数（更跟手）
const GEST_X_DEAD    = 0.02;     // 横向死区（防抖，几乎全行程生效）
const GEST_Y_DEAD    = 0.02;     // 纵向死区（防抖，几乎全行程生效）
const HOME_RECOVER_SMOOTH=0.06;  // 手离开画面后视角恢复默认的缓动系数
const HOME_CAM_POS   = new THREE.Vector3(0,15.6,9);    // 默认视角：斜上方 60° 俯瞰（距离≈18，更高更远）
const WIND_COUNT     = 9000;     // 粒子风粒子数
const WIND_SPHERE_R  = 7.2;      // 风球半径（粒子绕球表面流转）
const WIND_SHELL     = 0.8;      // 球壳厚度 ±（分布轻微起伏）
const WIND_SPEED     = 1.2;      // 满幅风速 (rad/s 角速度)：手越靠边风越大
const PAN_RANGE      = 8;        // 手位置平移范围（+/- 世界单位，序列2：手掌向上/下/左/右 → 粒子整体平移）
const ZOOM_SPEED     = 0.08;     // 变焦缓动系数（序列2：张开→放大，合拢→缩小）
const PAN_SPEED      = 0.10;     // 平移缓动系数
const GATHER_SPEED   = 0.08;     // 云十字聚集缓动系数
const GATHER_TRIG_ON = 0.14;     // 指尖分散度低于此值触发聚集十字（正常张掌≈0.22 不触发）
const CROSS_HALF     = 4.6;      // 云十字四端到中心距离
const CROSS_THICK    = 0.7;      // 云十字梁粗/端团厚度
const GEST_DETECT_INTERVAL = 2;  // 隔几帧检测一次（降低算力）
const CAM_DIST_MIN   = 5.5;      // 手势推拉最近距离
const CAM_DIST_MAX   = 28;       // 手势推拉最远距离
const CAM_ZOOM_SMOOTH= 0.08;     // 推拉缓动系数
const CAM_SIZE_DEAD  = 0.06;     // 手尺寸死区（防抖）

let handLandmarker = null;
let videoReady     = false;
let detectCount    = 0;
const handState = {
  detected:false,   // 当前是否检测到手
  targetRotVel:0,   // 目标旋转速度 (rad/s) — 绕 Y 轴（左右）
  rotVel:0,         // 缓动后的旋转速度 (Y)
  targetPitchVel:0, // 目标俯仰速度 (rad/s) — 上下（探头式：俯仰+距离联动）
  pitchVel:0,       // 缓动后的俯仰速度
  pitch:1.05,       // 当前俯仰角 (rad)，默认约60°（HOME_CAM_POS 俯仰角）
  targetWindVel:0,  // 目标风速 (units/s) — 粒子风形态（左右）
  windVel:0,        // 缓动后的风速
  zoomLevel:0.5,    // 变焦级别 0~1（序列2：张开→放大/近，合拢→缩小/远）
  panX:0,panY:0,    // 二维平移偏移（手掌位置→粒子整体平移）
  targetGather:0,   // 目标聚集度 0~1（云→十字型）
  gather:0,         // 缓动聚集度
  targetDist:null,  // 目标相机距离
  sizeRef:null,     // 基准手尺寸（首次检测记录）
  baseDist:null,    // 基准相机距离（首次检测记录）
};

function getPalmCenter(lm){
  const ix=[0,5,9,13,17];let cx=0,cy=0,cz=0;
  for(const i of ix){cx+=lm[i].x;cy+=lm[i].y;cz+=lm[i].z;}
  return{x:cx/ix.length,y:cy/ix.length,z:cz/ix.length};
}
// 手在画面中的包围盒尺寸（手越大 = 离摄像头越近，作推拉的距离代理）
function getHandSize(lm){
  let minX=1,maxX=0,minY=1,maxY=0;
  for(const p of lm){
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  return Math.max(maxX-minX,maxY-minY);
}
// 合拢度检测（序列2）：指尖分散度 spread + 手指伸直度 ext
// 手心合拢 = 五指并拢且伸直（spread 小 + ext 大）；握拳 = 弯曲（ext 小）→ 区分开
function getGatherScore(lm){
  const tips=[8,12,16,20];
  let spread=0,c=0;
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
    spread+=Math.hypot(lm[tips[i]].x-lm[tips[j]].x,lm[tips[i]].y-lm[tips[j]].y,lm[tips[i]].z-lm[tips[j]].z);
    c++;
  }
  spread/=c;
  const FINGERS=[[8,5],[12,9],[16,13],[20,17]];
  let ext=0;
  for(const [tip,base] of FINGERS){
    ext+=Math.hypot(lm[tip].x-lm[0].x,lm[tip].y-lm[0].y,lm[tip].z-lm[0].z)/Math.max(Math.hypot(lm[base].x-lm[0].x,lm[base].y-lm[0].y,lm[base].z-lm[0].z),1e-6);
  }
  return {spread:spread, ext:ext/4};
}

function setGestBadge(state){
  const b=document.getElementById('gestureBadge');
  if(b)b.className='gesture-badge '+state;
}
function setGestureLabel(t){
  const l=document.getElementById('gestureLabel');
  if(l)l.textContent=t;
}
function showCamToast(msg,isError){
  const t=document.getElementById('camToast');
  if(!t)return;
  t.textContent=msg;
  t.style.borderColor=isError?'rgba(255,90,90,0.55)':'rgba(255,255,255,0.14)';
  t.style.display='block';
  clearTimeout(showCamToast._t);
  showCamToast._t=setTimeout(()=>{t.style.display='none';},5000);
}

const webcamVideo=document.getElementById('webcamVideo');
const gestToggleBtn=document.getElementById('gestToggle');
let gestEnabled=false;

function updateGestToggleUI(){
  if(!gestToggleBtn)return;
  gestToggleBtn.textContent=gestEnabled?'关闭手势':'开启手势';
  gestToggleBtn.classList.toggle('active',gestEnabled);
}

// 关闭手势：停止视频流、释放摄像头、复位控制状态
function stopGesture(){
  gestEnabled=false;
  handState.detected=false;
  gestLockH=false;
  currentSeq=1;
  updateSeqUI();
  handState.targetRotVel=0;
  handState.targetPitchVel=0;
  handState.targetDist=null;
  if(webcamVideo.srcObject){
    webcamVideo.srcObject.getTracks().forEach(t=>t.stop());
    webcamVideo.srcObject=null;
  }
  videoReady=false;handLandmarker=null;
  const w=document.getElementById('webcamWrap');if(w)w.classList.remove('on');
  setGestBadge('off');setGestureLabel('手势已关闭');
  updateGestToggleUI();
  updateGestLockUI();
}

// 视角高度锁定：锁定后上下手势不再改变视角高度（左右旋转/前后推拉照常），手可自由上下活动
let gestLockH=false;
const gestLockBtn=document.getElementById('gestLockBtn');
function updateGestLockUI(){
  if(!gestLockBtn)return;
  gestLockBtn.textContent=gestLockH?'解锁高度 (L)':'锁定高度 (L)';
  gestLockBtn.classList.toggle('active',gestLockH);
  gestLockBtn.disabled=!gestEnabled;   // 手势未开启时不可锁定
  if(seqBtn)seqBtn.disabled=!gestEnabled;
}
function toggleGestLockH(){
  if(!gestEnabled)return;
  gestLockH=!gestLockH;
  setGestureLabel(gestLockH?'🔒 视角高度已锁定 · 左右前后仍可控制':'🙌 伸开手掌控制');
  updateGestLockUI();
}
if(gestLockBtn)gestLockBtn.addEventListener('click',toggleGestLockH);
// L 键快捷切换高度锁定（手在操作时无需再点按钮）
window.addEventListener('keydown',e=>{
  if(e.key==='l'||e.key==='L')toggleGestLockH();
});

// ===== 手势序列切换：序列1（旋转/高度/推拉/握拳） ⇄ 序列2（+手心合拢→粒子合拢+拉远） =====

// 开启手势：请求摄像头 + 加载模型（用户主动点击才触发，避免一打开页面就弹权限）
async function startGesture(){
  if(gestEnabled)return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){
    showCamToast('当前环境无摄像头 API。',true);
    setGestBadge('off');setGestureLabel('手势不可用');
    return;
  }
  setGestBadge('off');setGestureLabel('请求摄像头…');
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:false
    });
  }catch(e){
    const msg=e.name==='NotAllowedError'
      ?'摄像头权限被拒绝：请点击地址栏锁形图标允许后重试。'
      :e.name==='NotFoundError'
      ?'未检测到摄像头。'
      :'摄像头错误：'+e.message;
    showCamToast(msg,true);
    setGestBadge('error');setGestureLabel('手势不可用');
    return;
  }
  webcamVideo.srcObject=stream;
  await webcamVideo.play();
  await new Promise(r=>webcamVideo.addEventListener('loadedmetadata',r,{once:true}));
  videoReady=true;
  const w=document.getElementById('webcamWrap');if(w)w.classList.add('on');
  setGestureLabel('加载手势模型…');
  try{
    const vision=await FilesetResolver.forVisionTasks(GEST_WASM);
    handLandmarker=await HandLandmarker.createFromOptions(vision,{
      baseOptions:{modelAssetPath:GEST_MODEL,delegate:'GPU'},
      runningMode:'VIDEO',numHands:1,
    });
    gestEnabled=true;
    setGestureLabel('🙌 伸开手掌控制');setGestBadge('lost');
    updateGestLockUI();
  }catch(e){
    showCamToast('手势模型加载失败，请重试。',true);
    setGestBadge('error');setGestureLabel('加载失败');
    // 失败时释放已占用的摄像头
    if(webcamVideo.srcObject){
      webcamVideo.srcObject.getTracks().forEach(t=>t.stop());
      webcamVideo.srcObject=null;
    }
    videoReady=false;handLandmarker=null;
    const w=document.getElementById('webcamWrap');if(w)w.classList.remove('on');
  }
  updateGestToggleUI();
}

function toggleGesture(){
  if(gestEnabled)stopGesture();
  else startGesture();
}
if(gestToggleBtn)gestToggleBtn.addEventListener('click',toggleGesture);

// 每帧调用：节流检测 + 缓动应用（旋转/推拉）
function updateGesture(dt){
  detectCount++;
  if(detectCount%GEST_DETECT_INTERVAL===0&&handLandmarker&&videoReady&&webcamVideo.readyState>=2){
    try{
      const res=handLandmarker.detectForVideo(webcamVideo,performance.now());
      if(res.landmarks&&res.landmarks.length>0){
        const lm=res.landmarks[0];
        const palm=getPalmCenter(lm);
        const size=getHandSize(lm);
        // 3D 坐标系：手位置 → 星云姿态速度
        // 左右 → 绕 Y 轴：手在左(palm.x 小) → 星云向左转，越靠左越快
        // 粒子风形态下：左右 → 风向（手在左 → 向左吹），不旋转星云
        const dx=(palm.x-0.5)*3;
        const drive=Math.max(-1,Math.min(1,dx));
        if(currentForm==='wind'){
          handState.targetWindVel=(Math.abs(drive)>GEST_X_DEAD)?drive*WIND_SPEED:0;
          handState.targetRotVel=0;
        }else{
          handState.targetRotVel=(Math.abs(drive)>GEST_X_DEAD)?drive*GEST_ROT_SPEED:0;
        }
        // 上下 → 俯仰（探头式 D）：手在上 → 俯仰加大+拉近，手在下 → 俯仰减小+推远
        const dy=(0.5-palm.y)*3;
        const driveY=Math.max(-1,Math.min(1,dy));
        if(currentSeq===1){
          handState.targetPitchVel=(Math.abs(driveY)>GEST_Y_DEAD)?driveY*PITCH_SPEED:0;
        }
        // 前后 → 推拉：画面中手越大 = 越靠近 → 拉近
        if(!handState.detected){
          handState.sizeRef=size;
          handState.baseDist=camera.position.distanceTo(controls.target);
          handState.targetDist=handState.baseDist;
          // 同步当前相机俯仰（鼠标拖拽后手势接手时继承角度）
          const dv0=new THREE.Vector3().subVectors(camera.position,controls.target);
          handState.pitch=Math.atan2(dv0.y,Math.hypot(dv0.x,dv0.z));
          handState.detected=true;
        }else{
          const ratio=size/handState.sizeRef;
          if(Math.abs(ratio-1)>CAM_SIZE_DEAD){
            handState.targetDist=THREE.MathUtils.clamp(
              handState.baseDist/ratio,CAM_DIST_MIN,CAM_DIST_MAX);
          }
        }
        // 序列2：手掌张合→变焦，手掌位置→平移（张开放大，合拢缩小，上下左右平移）
        if(currentSeq===2){
          const gs=getGatherScore(lm);
          const zoomRaw=(gs.spread-0.08)/0.14;  // spread 0.08→0, 0.22→1
          handState.zoomLevel+=(Math.max(0,Math.min(1,zoomRaw))-handState.zoomLevel)*ZOOM_SPEED;
          handState.panX+=((palm.x-0.5)*PAN_RANGE-handState.panX)*PAN_SPEED;
          handState.panY+=((0.5-palm.y)*PAN_RANGE-handState.panY)*PAN_SPEED;
          // 云聚集：手势合拢（指尖并拢 spread 小）→ 云粒子聚成十字型（四端浓密）
          handState.targetGather=Math.max(0,Math.min(1,(GATHER_TRIG_ON-gs.spread)/(GATHER_TRIG_ON-0.05)));
          handState.gather+=(handState.targetGather-handState.gather)*GATHER_SPEED;
        }
        setGestBadge('tracking');
      }else{
        if(handState.detected){
          handState.detected=false;
          handState.targetRotVel=0;    // 手离开 → 停止旋转驱动
          handState.targetPitchVel=0; // 手离开 → 停止俯仰驱动
          handState.targetWindVel=0;   // 手离开 → 风渐停
          handState.zoomLevel=0.5;handState.panX=0;handState.panY=0;handState.targetGather=0;handState.gather=0;  // 手离开 → 变焦/平移/十字复位
          handState.targetDist=null;   // 手离开 → 推拉让位给默认视角恢复
        }
        setGestBadge('lost');
      }
    }catch(e){}
  }

  // 手势控制仅在开启时生效（关闭后鼠标/键盘操作完全正常）
  if(gestEnabled){
    if(handState.detected){
      // 左右：粒子风形态 → 球面流转（在动画循环中应用）；其他形态 → 星云绕 Y 轴旋转
      if(currentForm!=='wind'){
        handState.rotVel+=(handState.targetRotVel-handState.rotVel)*GEST_ROT_SMOOTH;
        orbitGroup.rotation.y+=handState.rotVel*dt;
      }
      // 前后 → 推拉：手近（画面中大）→ 拉近，手远 → 推远
      if(handState.targetDist!=null){
        const dir=new THREE.Vector3().subVectors(camera.position,controls.target);
        const cur=dir.length();
        const next=cur+(handState.targetDist-cur)*CAM_ZOOM_SMOOTH;
        dir.normalize().multiplyScalar(next);
        camera.position.copy(controls.target).add(dir);
      }
      // 上下 → 俯仰+距离联动（探头式 D）：手在上→俯仰加大+拉近，手在下→俯仰减小+推远
      // L 锁俯仰（gestLockH 变量复用）
      if(!gestLockH){
        handState.pitchVel+=(handState.targetPitchVel-handState.pitchVel)*GEST_ROT_SMOOTH;
        handState.pitch+=handState.pitchVel*dt;
        handState.pitch=THREE.MathUtils.clamp(handState.pitch,PITCH_MIN,PITCH_MAX);
      }
      // 应用俯仰到相机位置（保持水平方位，推拉距离之上叠加俯仰距离缩放）
      {
        const tgt=controls.target;
        const dv=new THREE.Vector3().subVectors(camera.position,tgt);
        const curDist=dv.length();
        const horiz=Math.hypot(dv.x,dv.z);
        const hx=horiz>1e-6?dv.x/horiz:1;
        const hz=horiz>1e-6?dv.z/horiz:0;
        const pitchN=(handState.pitch-PITCH_MIN)/(PITCH_MAX-PITCH_MIN);
        const distScale=PITCH_DIST_FAR+(PITCH_DIST_NEAR-PITCH_DIST_FAR)*pitchN;
        dv.set(hx*Math.cos(handState.pitch),Math.sin(handState.pitch),hz*Math.cos(handState.pitch)).multiplyScalar(curDist*distScale);
        camera.position.copy(tgt).add(dv);
      }
    }else{
      // 手离开画面 → 星云平滑恢复正面姿态，相机平滑回到斜上方默认视角
      // 高度锁定 L 时：只恢复水平位置，保持当前锁定高度
      // （粒子自身的自转/漂移动画不受影响，继续播放）
      orbitGroup.rotation.y+=(0-orbitGroup.rotation.y)*HOME_RECOVER_SMOOTH;
      windGroup.rotation.y+=(0-windGroup.rotation.y)*HOME_RECOVER_SMOOTH;   // 风停回正
      if(gestLockH){
        camera.position.x+=(HOME_CAM_POS.x-camera.position.x)*HOME_RECOVER_SMOOTH;
        camera.position.z+=(HOME_CAM_POS.z-camera.position.z)*HOME_RECOVER_SMOOTH;
      }else{
        camera.position.lerp(HOME_CAM_POS,HOME_RECOVER_SMOOTH);
      }
    }
  }
}

// 冷色星云主体(约80%) + 稀疏暖金星点(约12%) + 少量暗红点缀(约7%)，整体压低亮度营造深邃星空
function pickParticleColor(rNorm, scheme){
  const cs = scheme.colors;
  let h, s, l;
  const roll = Math.random();

  if(roll < 0.12 - 0.04 * rNorm){
    // 稀疏暖金星点：概率随半径略降，高亮散布作恒星
    const i = Math.floor(Math.random() * 3);          // 暖星锚 0-2
    [h,s,l] = cs[i];
    l = Math.min(0.96, l + Math.random() * 0.18);     // 高亮星光
    s = Math.max(0.08, Math.min(0.70, s + (Math.random() - 0.5) * 0.15));
  }else if(roll < 0.19 - 0.04 * rNorm){
    // 少量暗红点缀：低饱和偏暗的红，如遥远红巨星，不喧宾夺主
    [h,s,l] = cs[9];                                   // 红锚 9
    l = Math.max(0.16, Math.min(0.66, l + (Math.random() - 0.5) * 0.18));
    s = Math.max(0.18, Math.min(0.78, s + (Math.random() - 0.5) * 0.16));
  }else{
    // 冷色星云主体：蓝紫/靛蓝为主，冰青点缀，压低亮度 → 深邃
    if(Math.random() < 0.72){
      const i = 3 + Math.floor(Math.random() * 4);    // 冷主体 3-6
      [h,s,l] = cs[i];
    }else{
      const i = 7 + Math.floor(Math.random() * 2);    // 冰青点缀 7-8
      [h,s,l] = cs[i];
    }
    l = Math.max(0.15, Math.min(0.72, l + (Math.random() - 0.5) * 0.26));
    s = Math.max(0.12, Math.min(0.85, s + (Math.random() - 0.5) * 0.22));
  }

  h += (Math.random() - 0.5) * 0.09;

  // tint 偏移
  if(currentTintHue !== null){
    const diff = currentTintHue - h;
    h += diff * 0.40;
  }
  h = ((h % 1) + 1) % 1;

  return new THREE.Color().setHSL(h, s, l);
}

// 统一重着色（换配色 / 快速选色时复用），自动区分星云与立方体的半径归一化参考
function recolorLayer(layer, scheme){
  if(layer.isDrift)return;
  const colAttr=layer.geometry.attributes.color;const colArr=colAttr.array;
  const ref=layer.isCloud?CLOUD_REF:MAX_RADIUS_REF;
  for(let i=0;i<layer.count;i++){
    const r=layer.radii?layer.radii[i]:0;
    const rNorm=Math.min(1,r/ref);
    const c=pickParticleColor(rNorm,scheme);
    colArr[i*3]=Math.min(1,c.r*layer.brightness);
    colArr[i*3+1]=Math.min(1,c.g*layer.brightness);
    colArr[i*3+2]=Math.min(1,c.b*layer.brightness);
  }
  colAttr.needsUpdate=true;
  if(layer.flickSaved)layer.flickSaved.set(colArr);
}

// 标准正态分布采样（Box-Muller），用于无定形云的多高斯斑块
function gauss(){
  let u=0,v=0;
  while(u===0)u=Math.random();
  while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

// ==================== BUILD PARTICLES：二型 无定形不规则云（多高斯斑块融合） ====================
(function createCloudParticles(){
  const count = CLOUD_PARTICLE_COUNT;
  // 多个高斯斑块叠加，形成轮廓不规则、边界模糊的无定形云
  const BLOB_COUNT = 6;
  const bcx=new Float32Array(BLOB_COUNT), bcy=new Float32Array(BLOB_COUNT), bcz=new Float32Array(BLOB_COUNT);
  const bsigma=new Float32Array(BLOB_COUNT);
  for(let b=0;b<BLOB_COUNT;b++){
    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos(2*Math.random()-1);
    const rr=2.6*Math.sqrt(Math.random());
    bcx[b]=rr*Math.sin(phi)*Math.cos(theta);
    bcy[b]=rr*Math.sin(phi)*Math.sin(theta);
    bcz[b]=rr*Math.cos(phi);
    bsigma[b]=2.0+Math.random()*1.4;
  }
  const posArr = new Float32Array(count*3);
  const colArr = new Float32Array(count*3);
  const radii  = new Float32Array(count);
  for(let i=0;i<count;i++){
    const b=Math.floor(Math.random()*BLOB_COUNT);
    const x=bcx[b]+gauss()*bsigma[b];
    const y=bcy[b]+gauss()*bsigma[b];
    const z=bcz[b]+gauss()*bsigma[b];
    posArr[i*3]=x; posArr[i*3+1]=y; posArr[i*3+2]=z;
    radii[i]=Math.sqrt(x*x+y*y+z*z);
  }
  // 十字汇聚目标：手势合拢时各粒子聚集的十字形位置（四端各成浓密团 + 横竖梁）
  const crossArr = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const slot=i%6, H=CROSS_HALF, TH=CROSS_THICK;
    let tx,ty,tz;
    if(slot<4){                 // 左/右/上/下 四端浓密团
      const horiz=slot===0?-H:slot===1?H:0;
      const vert =slot===2? H:slot===3?-H:0;
      tx=slot<2?horiz:TH*0.5*gauss();
      ty=slot>=2?vert:TH*0.5*gauss();
      tz=TH*0.35*gauss();
    }else if(slot===4){         // 横梁
      tx=(Math.random()*2-1)*H*0.95; ty=TH*0.5*gauss(); tz=TH*0.35*gauss();
    }else{                       // 竖梁
      tx=TH*0.5*gauss(); ty=(Math.random()*2-1)*H*0.95; tz=TH*0.35*gauss();
    }
    crossArr[i*3]=tx; crossArr[i*3+1]=ty; crossArr[i*3+2]=tz;
  }
  // 十字权重：约15%的粒子不参与聚集（保持飘荡），其余粒子平滑过渡到十字形
  const crossWeight = new Float32Array(count);
  for(let i=0;i<count;i++) crossWeight[i]=Math.random()<0.15?0:0.85+Math.random()*0.15;
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(posArr,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colArr,3));
  const mat=new THREE.PointsMaterial({
    size:0.22,map:glowTex,vertexColors:true,
    blending:THREE.AdditiveBlending,depthWrite:false,depthTest:true,
    transparent:true,opacity:0.85,
  });
  const pts=new THREE.Points(geo,mat);
  cloudGroup.add(pts);

  const layer={
    name:'cloud',form:'cloud',isCloud:true,
    points:pts,geometry:geo,material:mat,
    origPositions:new Float32Array(posArr),
    phases:new Float32Array(count*3),
    displacement:new Float32Array(count*3),
    initThetas:null,radii,flickTimers:null,flickSaved:null,crossArr,crossWeight,
    baseSize:0.22,brightness:1.0,schemeKey:'cloud',count,
    isDrift:false,
  };
  for(let i=0;i<count*3;i++)layer.phases[i]=Math.random()*Math.PI*2;
  layers.push(layer);
  recolorLayer(layer, COLOR_SCHEMES[currentScheme]);
})();

// ==================== ANIMATION LOOP ====================

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1);
  const dt60=dt*60;
  const elapsed=clock.getElapsedTime();

  controls.update();

  // 手势检测 + 相机控制（旋转/推拉）
  updateGesture(dt);

  // Global rotation (slow)
  particleGroup.rotation.y += 0.0003;
  particleGroup.updateMatrixWorld();

  // ---- 序列2：变焦（手掌张→放大/近，合拢→缩小/远）+ 平移（手掌位置→粒子整体平移） ----
  if(currentSeq===2){
    const zoomDist=CAM_DIST_MIN+(CAM_DIST_MAX-CAM_DIST_MIN)*(1-handState.zoomLevel);
    const dirV=new THREE.Vector3().subVectors(camera.position,controls.target).normalize();
    const curD=camera.position.distanceTo(controls.target);
    const nextD=curD+(zoomDist-curD)*0.06;
    camera.position.copy(controls.target).addScaledVector(dirV,nextD);
    orbitGroup.position.x=handState.panX;
    orbitGroup.position.y=handState.panY;
  }

  // ---- Per-layer particle update (布朗运动 + 闪烁, 无斥力) ----
  for(const layer of layers){
    if(layer.form!==currentForm)continue;
    const posAttr=layer.geometry.attributes.position;
    const colAttr=layer.geometry.attributes.color;
    const posArr=posAttr.array;const colArr=colAttr?colAttr.array:null;
    const orig=layer.origPositions;const phases=layer.phases;
    const disp=layer.displacement;const n=layer.count;
    const isOuter=(layer.flickTimers!==null);
    const isDrift=!!layer.isDrift;
    let colDirty=false;
    for(let i=0;i<n;i++){
      const i3=i*3;

      // -- 二型：持续漂移游走（方向缓慢转向 + 软边界拉回，无硬边） --
      if(layer.isCloud){
        phases[i3]  +=(Math.random()-0.5)*CLOUD_DRIFT_TURN*dt;
        phases[i3+1]+=(Math.random()-0.5)*CLOUD_DRIFT_TURN*dt;
        phases[i3+2]+=(Math.random()-0.5)*CLOUD_DRIFT_TURN*dt;
        let nx=posArr[i3]  +Math.sin(phases[i3])  *CLOUD_DRIFT_SPEED*dt;
        let ny=posArr[i3+1]+Math.sin(phases[i3+1])*CLOUD_DRIFT_SPEED*dt;
        let nz=posArr[i3+2]+Math.sin(phases[i3+2])*CLOUD_DRIFT_SPEED*dt;
        const r=Math.hypot(nx,ny,nz);
        if(r>CLOUD_SOFT_RADIUS){
          const f=Math.max(0, 1 - CLOUD_SPRING_K*dt*(r-CLOUD_SOFT_RADIUS)/r);
          nx*=f; ny*=f; nz*=f;
        }
        // 手势合拢 → 云聚成十字型（四端浓密）
        const gx=handState.gather*layer.crossWeight[i], ta=layer.crossArr;
        posArr[i3]  =nx*(1-gx)+ta[i3]*gx;
        posArr[i3+1]=ny*(1-gx)+ta[i3+1]*gx;
        posArr[i3+2]=nz*(1-gx)+ta[i3+2]*gx;
        continue;
      }

      // -- Brownian --
      phases[i3]+=(Math.random()-0.5)*BROWNIAN_SPEED*dt60;
      phases[i3+1]+=(Math.random()-0.5)*BROWNIAN_SPEED*dt60;
      phases[i3+2]+=(Math.random()-0.5)*BROWNIAN_SPEED*dt60;
      const bx=Math.sin(phases[i3])*BROWNIAN_AMPLITUDE;
      const by=Math.sin(phases[i3+1])*BROWNIAN_AMPLITUDE;
      const bz=Math.sin(phases[i3+2])*BROWNIAN_AMPLITUDE;

      // Compose position (Brownian only, no repulsion)
      posArr[i3]=orig[i3]+bx;
      posArr[i3+1]=orig[i3+1]+by;
      posArr[i3+2]=orig[i3+2]+bz;

      // -- Flicker for outer particles --
      if(isOuter&&colArr){
        let ft=layer.flickTimers[i];
        if(ft>0){ft--;layer.flickTimers[i]=ft;if(ft===0){colArr[i3]=layer.flickSaved[i3];colArr[i3+1]=layer.flickSaved[i3+1];colArr[i3+2]=layer.flickSaved[i3+2];colDirty=true;}}
        else if(Math.random()<FLICKER_CHANCE*dt60){
          layer.flickSaved[i3]=colArr[i3];layer.flickSaved[i3+1]=colArr[i3+1];layer.flickSaved[i3+2]=colArr[i3+2];
          const boost=Math.min(1,FLICKER_BOOST*(0.7+Math.random()*0.3));
          colArr[i3]=Math.min(1,colArr[i3]*boost);colArr[i3+1]=Math.min(1,colArr[i3+1]*boost);colArr[i3+2]=Math.min(1,colArr[i3+2]*boost);
          layer.flickTimers[i]=FLICKER_FRAMES;colDirty=true;
        }
      }
    }
    posAttr.needsUpdate=true;
    if(colDirty&&colAttr)colAttr.needsUpdate=true;
  }

  // ---- Galaxy differential rotation (per-layer Y-axis rotation modifier) ----
  // Instead of messing per-particle, rotate each layer's Points at different speeds
  if(userFlowScale>0.001){
    const baseSpeed=FLOW_SPEED_BASE*userFlowScale*dt60*0.016;
    for(const layer of layers){
      if(layer.form!=='nebula')continue;
      if(layer.isDrift){layer.points.rotation.y+=baseSpeed*0.4;continue;}
      // sphere rotates fastest, ring3 slowest (like real galaxy)
      const speedMod=layer.name==='sphere'?1.6:layer.name==='ring1'?1.2:layer.name==='ring2'?0.75:0.40;
      layer.points.rotation.y+=baseSpeed*speedMod;
    }
  }

  // ---- 粒子风形态：粒子绕球面流转（风向由掌心左右控制，手离开风渐停） ----
  if(currentForm==='wind'){
    handState.windVel+=(handState.targetWindVel-handState.windVel)*GEST_ROT_SMOOTH;
    windGroup.rotation.y+=handState.windVel*dt;
    windGroup.scale.set(1,1,1);
  }

  // ---- Bloom ----
  bloomPass.strength=userBloom+Math.sin(elapsed*0.42)*0.05;

  composer.render();
}

const schemeBtns=document.querySelectorAll('.scheme-btn');

function switchColorScheme(schemeKey){
  if(!COLOR_SCHEMES[schemeKey]||schemeKey===currentScheme)return;
  currentScheme=schemeKey;

  for(const layer of layers)recolorLayer(layer,scheme);
  updateActiveSchemeBtn(schemeKey);
}

function updateActiveFormBtn(form){
  formBtns.forEach(b=>b.classList.toggle('active',b.dataset.form===form));
}
function switchForm(form){
  if(!['nebula','cloud','wind'].includes(form)||form===currentForm)return;
  currentForm=form;
  particleGroup.visible=(form==='nebula');
  cloudGroup.visible=(form==='cloud');
  windGroup.visible=(form==='wind');
  updateActiveFormBtn(form);
}

  switchForm(currentForm==='nebula'?'cloud':currentForm==='cloud'?'wind':'nebula');
}
